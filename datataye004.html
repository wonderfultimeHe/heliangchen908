<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型</title>

</head>
<body>
    <div class="container">
    <!--   -->

    </div>
<script>
    var a=10,b=4;
    console.log(++a);
    console.log(a-b>0?a:b);
    console.log(true&&false,true||false,!true);
    var str ='hello world ',num=10,ble=true,
    ud,obj={name:'张三',age:20},arr=[1,2,3,4]; 
    console.log(typeof str,typeof num,typeof ble,typeof ud,
    typeof obj,typeof arr);
    console.log(0.1+0.2==0.3,0.1+0.1==0.2);  
    //字符串类型转换，将数字转成字符串，-用能用于数值运算
    console.log('1'+1,1-'1','11'+1-1);  
    
    

    var grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(10, 1fr)';
    grid.style.gap = '10px';
    document.body.appendChild(grid);
    for(var i=1;i<=100;i++){
        if(i%7==0||i.toString().indexOf('7')!=-1){
            continue;
        }
        var cell = document.createElement('div');
        cell.textContent = i;
        grid.appendChild(cell);
    }

    

</script>
</body>
</html>
